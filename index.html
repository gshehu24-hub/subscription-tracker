<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Subscription Tracker</h1>
  </header>

  <main>
    <section id="form-section">
      <h2>Add Subscription</h2>
      <form id="subscription-form">
        <label for="service">Service</label>
        <input type="text" id="service" name="service" required>

        <label for="provider">Provider</label>
        <input type="text" id="provider" name="provider" required>

        <label for="subscriber">Subscriber</label>
        <input type="text" id="subscriber" name="subscriber" required>

        <label for="renewal-date">Renewal date</label>
        <input type="date" id="renewal-date" name="renewal-date" required>

        <label for="category">Category</label>
        <input type="text" id="category" name="category" required>

        <button type="submit">Add</button>
      </form>
    </section>

    <section id="table-section">
      <h2>Subscriptions</h2>
      <table id="subscription-table">
        <thead>
          <tr>
            <th>Service</th>
            <th>Provider</th>
            <th>Subscriber</th>
            <th>Renewal date</th>
            <th>Category</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="subscription-body"></tbody>
      </table>
    </section>

    <section id="summary-section">
      <h2>Summary</h2>
      <p>Total subscriptions: <span id="total-count">0</span></p>
      <p>Expired subscriptions: <span id="expired-count">0</span></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
